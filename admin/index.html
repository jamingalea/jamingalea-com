<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Portfolio CMS</title>
<link rel="icon" href="/images/FaBhTUwoopy0qvtqBlnsbbYw.png">
<script>try{var t=localStorage.getItem('cms-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<header class="bar">
  <div class="bar__brand">
    <strong>Portfolio CMS</strong>
    <span id="conn" class="conn">Loading…</span>
  </div>
  <div class="bar__mid" role="tablist" aria-label="View">
    <button class="seg is-on" data-view="edit" type="button">Edit</button>
    <button class="seg" data-view="preview" type="button">Preview</button>
  </div>
  <div class="bar__actions">
    <span id="dirty" class="dirty" hidden></span>
    <button id="btn-theme" class="btn btn--ghost theme-toggle" type="button" title="Switch to dark mode" aria-label="Switch to dark mode">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
    </button>
    <button id="btn-more" class="btn btn--ghost" type="button" aria-haspopup="menu">More</button>
    <div id="menu" class="menu" role="menu" hidden>
      <button type="button" role="menuitem" data-act="reload">Reload latest published version</button>
      <button type="button" role="menuitem" data-act="discard">Discard unpublished changes</button>
      <button type="button" role="menuitem" data-act="download">Download content.json</button>
      <a role="menuitem" href="/" target="_blank" rel="noopener">Open live site ↗</a>
      <a role="menuitem" href="/admin/logout">Sign out</a>
    </div>
    <button id="btn-publish" class="btn btn--primary" type="button">Publish</button>
  </div>
</header>

<div class="layout" data-view="edit">
  <aside class="editor">
    <nav class="tabs" aria-label="Sections">
      <button type="button" data-tab="projects" class="is-on">Projects</button>
      <button type="button" data-tab="caseStudies">Case studies</button>
      <button type="button" data-tab="intro">Intro</button>
      <button type="button" data-tab="highlights">Highlights</button>
      <button type="button" data-tab="footer">Footer</button>
      <button type="button" data-tab="settings">Settings &amp; SEO</button>
    </nav>
    <div id="panel" class="panel"></div>
  </aside>
  <section class="preview">
    <div class="preview__bar">
      <div class="devices" role="group" aria-label="Preview size">
        <button type="button" data-device="desktop" class="is-on">Desktop</button>
        <button type="button" data-device="tablet">Tablet</button>
        <button type="button" data-device="mobile">Phone</button>
        <button type="button" data-device="custom" hidden>Custom · <span id="custom-width"></span>px</button>
      </div>
      <select id="preview-page" class="page-select" aria-label="Page to preview" hidden></select>
      <span class="muted small">Live preview of your unpublished edits</span>
    </div>
    <div class="preview__stage">
      <iframe id="preview" title="Site preview"></iframe>
      <div class="handle handle--l" data-side="-1" role="separator" aria-orientation="vertical" aria-label="Drag to resize preview" tabindex="0"></div>
      <div class="handle handle--r" data-side="1" role="separator" aria-orientation="vertical" aria-label="Drag to resize preview" tabindex="0"></div>
      <div id="size-badge" class="size-badge" hidden></div>
    </div>
  </section>
</div>


<dialog id="dlg-publish" class="dlg">
  <form method="dialog" id="form-publish">
    <h2>Publish changes</h2>
    <ul id="publish-summary" class="summary"></ul>
    <label>Description of the change<input name="message" required></label>
    <p id="publish-msg" class="msg" role="status"></p>
    <div class="dlg__actions">
      <span class="spacer"></span>
      <button type="button" class="btn btn--ghost" data-act="close">Cancel</button>
      <button type="submit" class="btn btn--primary">Publish</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="/admin/admin.mjs"></script>
</body>
</html>
